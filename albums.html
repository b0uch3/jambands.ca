<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102720">
  <meta name="description" content="Albums shared by the Jambands.ca community over the years.">
  <title>What album are you listening to? · Jambands.ca</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="albums.css">
  <script src="albums.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead"><a class="wordmark" href="./" aria-label="Jambands.ca home">jambands<span>.ca</span></a><a class="back-link" href="./">← Back to the music</a></header>
    <main class="album-page">
      <div class="album-heading"><p class="eyebrow">From the Soundboard archives</p><h1>What album are<br>you listening to<span class="period">?</span></h1><p class="album-intro">A listening diary made by the people who were there. Browse the records they shared and the words they wrote.</p><p id="album-status" class="album-status" role="status">Loading the archive…</p></div>
      <div class="album-controls"><label for="album-search">Find an album, artist, or person</label><input id="album-search" type="search" placeholder="Search the listening diary" autocomplete="off"><label for="album-year">Year</label><select id="album-year"><option value="">All years</option></select></div>
      <div id="album-list" class="album-list" aria-live="polite"></div>
      <button id="album-more" class="album-more" type="button" hidden>Show more albums</button>
    </main>
    <footer><span>Jambands.ca</span><span>Voices from the original forum · Still listening.</span></footer>
  </div>
</body>
</html>
